<VirtualHost *:80>
        ServerName minecraft.of.by
        ServerAlias www.minecraft.of.by

        UseCanonicalName On

        TimeOut 30
        # Identical to combined format, except that we swap remote-host (%h) with X-Forwarded-For
        SetEnvIf REMOTE_ADDR "(.+)" CLIENTIP=$1
        SetEnvIf X-Forwarded-For "^([0-9.]+)" CLIENTIP=$1

        # Identical to combined format, except that we swap remote-host (%h) with X-Forwared-For
        LogFormat "%{X-Forwaded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-agent}i\""

        CustomLog "|$/usr/bin/cronolog -l /home/drendov/vhosts/minecraft.of.by/logs/access.log /home/drendov/vhosts/minecraft.of.by/logs/access.%Y-%m-%d.log" vhost_combined
        ErrorLog  "|$/usr/bin/cronolog -l /home/drendov/vhosts/minecraft.of.by/logs/error.log /home/drendov/vhosts/minecraft.of.by/logs/error.%Y-%m-%d.log"
        CustomLog "|$/usr/bin/cronolog -l /home/drendov/vhosts/minecraft.of.by/logs/latency.log /home/drendov/vhosts/minecraft.of.by/logs/latency.%Y-%m-%d.log" "%D %r"

        ErrorDocument 500 /static/500.html
        ErrorDocument 503 /static/maintenance.html

        RewriteEngine on
        #LogLevel warn rewrite:trace4

        RequestHeader set HTTP_HOST minecraft.of.by

        RewriteRule /robots.txt /home/drendov/vhosts/minecraft.of.by/public_html/mob/static/robots.txt [L]
        RewriteRule /google56e220698a8467a2.html /home/drendov/vhosts/minecraft.of.by/public_html/mob/static/google56e220698a8467a2.html
        # RewriteRule /sitemap(.*) /home/drendov/vhosts/minecraft.of.by/sitemap$1 [L]
        RewriteRule /about.html /home/drendov/vhosts/minecraft.of.by/public_html/mob/static/about.html [L]

        # serve static files using the /static/ format
        RewriteCond %{REQUEST_FILENAME} ^/static/(.*)
        RewriteCond /home/drendov/vhosts/minecraft.of.by/public_html/mob/static/%1 -f
        RewriteRule ^/static/(.+)$ /home/drendov/vhosts/minecraft.of.by/public_html/mob/static/$1 [L]

        # serve media files using the /media/ format
        RewriteCond %{REQUEST_FILENAME} ^/media/(.*)
        RewriteCond /home/drendov/vhosts/minecraft.of.by/public_html/mob/media/%1 -f
        RewriteRule ^/media/(.+)$ /home/drendov/vhosts/minecraft.of.by/public_html/mob/media/$1 [L]

        # Move dynmap to a new place
        RewriteRule /map/ /survival/ [R]

        # Force browsers to not cache non-static stuff client-side
        Header merge Cache-Control no-store

        <LocationMatch "^/static">
           ExpiresActive On
            ExpiresDefault "modified plus 1 year"
            FileETag Size
        </LocationMatch>

        <IfVersion >= 2.4>
          # this happens only in versions greater or equal 2.4.0.
           <Location />
               Require all granted
           </Location>
        </IfVersion>

        # Force browsers to not cache non-static stuff client-side
        Header merge Cache-Control no-store

        WSGIDaemonProcess drendov user=drendov threads=2 processes=4 python-home=/home/drendov/vhosts/minecraft.of.by/public_html/python-bin python-path=/home/drendov/vhosts/minecraft.of.by/public_html receive-buffer-size=87380 send-buffer-size=87380 deadlock-timeout=60 maximum-requests=1000 inactivity-timeout=3600
        WSGIScriptAlias / /home/drendov/vhosts/minecraft.of.by/public_html/etc/application.wsgi
        WSGIProcessGroup drendov
        WSGIPassAuthorization On
</VirtualHost>
